# Parameters
nc: 6
scales:
  s: [0.33, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4 (P3/8)
  - [-1, 1, MRFFE, [256]] # 5 ⭐ 增强Backbone P3原始特征
  - [-1, 1, SCDown, [512, 3, 2]] # 6-P4/16
  - [-1, 6, C2f, [512, True]] # 7 (P4/16)
  - [-1, 1, MRFFE, [512]] # 8 ⭐ 增强Backbone P4原始特征
  - [-1, 1, SCDown, [1024, 3, 2]] # 9-P5/32
  - [-1, 3, C2fCIB, [1024, True, True]] # 10
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 1, PSA, [1024]] # 12 (P5/32)
  - [-1, 1, MRFFE, [1024]] # 13 ⭐ 增强Backbone P5原始特征

# YOLOv10s head (Neck层号顺延，引用Backbone MRFFE输出)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 8], 1, Concat, [1]] # 15 cat backbone P4 (引用层8=MRFFE增强后)
  - [-1, 3, C2f, [512]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 5], 1, Concat, [1]] # 18 cat backbone P3 (引用层5=MRFFE增强后)
  - [-1, 3, C2f, [256]] # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P4
  - [-1, 3, C2f, [512]] # 22 (P4/16-medium)

  - [-1, 1, SCDown, [512, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P5 (引用层13=MRFFE增强后)
  - [-1, 3, C2fCIB, [1024, True, True]] # 25 (P5/32-large)

  - [[19, 22, 25], 1, v10Detect, [nc]] # 26 Detect(P3, P4, P5)